<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jojo Auction</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: {
                            bg: 'var(--color-bg)',
                            surface: 'var(--color-surface)',
                            card: 'var(--color-card)',
                            primary: 'var(--color-primary)',
                            primaryDark: 'var(--color-primary-dark)',
                            gold: 'var(--color-gold)',
                            goldDark: 'var(--color-gold-dark)',
                            text: 'var(--color-text)',
                            muted: 'var(--color-muted)',
                            danger: 'var(--color-danger)',
                            success: 'var(--color-success)',
                        }
                    },
                    fontFamily: {
                        title: ['Oswald', 'sans-serif'],
                        body: ['Inter', 'sans-serif']
                    },
                    boxShadow: {
                        'glow-primary': 'var(--shadow-primary)',
                        'glow-gold': 'var(--shadow-gold)',
                        'glow-danger': 'var(--shadow-danger)',
                    },
                    borderRadius: {
                        'xl': 'var(--radius-md)',
                        '2xl': 'var(--radius-lg)',
                        '3xl': 'var(--radius-xl)',
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            /* Color Palette */
            --color-bg: #111111;
            --color-surface: #0f101c;
            --color-card: #111111;
            --color-primary: #0ea5e9;
            --color-primary-dark: #0284c7;
            --color-gold: #00f5ff; /* Neon Aqua replacing Gold */
            --color-gold-dark: #06b6d4; /* Darker Aqua */
            --color-text: #f8fafc;
            --color-muted: #94a3b8;
            --color-danger: #ef233c;
            --color-success: #10b981;

            /* Effects */
            --shadow-primary: 0 0 0 0;
            --shadow-gold: 0 0 0 0;
            --shadow-danger: 0 0 0 0;
            
            /* Border Radii */
            --radius-md: 0.75rem;
            --radius-lg: 1.25rem;
            --radius-xl: 1.75rem;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            background-attachment: fixed;
        }

        h1, h2, h3, .font-title {
            font-family: 'Oswald', sans-serif;
        }
        
        /* Screens */
        .screen {
            display: none;
            min-height: 100vh;
            width: 100%;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .screen.active {
            display: flex;
            opacity: 1;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Buttons */
        .btn-gold {
            background: linear-gradient(135deg, var(--color-gold) 0%, var(--color-gold-dark) 100%);
            color: #111;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-gold:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-gold);
            filter: brightness(1.1);
        }
        .btn-gold:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-primary-dark) 0%, var(--color-primary) 100%);
            color: #fff;
            border: 1px solid var(--color-gold);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-primary);
            filter: brightness(1.1);
        }

        /* Cards & Containers */
        .glass-card {
            background: rgba(26, 19, 64, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .jojo-border {
            border: 2px solid var(--color-primary);
        }
        .jojo-border-gold {
            border: 2px solid var(--color-gold);

        }

        /* Inputs */
        .custom-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(157, 78, 221, 0.5);
            transition: all 0.3s ease;
        }
        .custom-input:focus {
            border-color: var(--color-gold);
            outline: none;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--color-primary-dark); border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-primary); }

        /* Icon Styling */
        .icon-svg {
            display: inline-block;
            vertical-align: middle;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body class="antialiased selection:bg-theme-gold selection:text-black">

    <!-- Alert Modal -->
    <div id="alert-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 transition-all">
        <div class="glass-card border-2 border-theme-danger rounded-2xl p-8 max-w-sm w-full text-center shadow-glow-danger transform transition-all scale-100">
            <div class="mb-4 flex justify-center">
                <img src="assets/icons/warning.svg" alt="⚠️" class="w-16 h-16 icon-svg drop-shadow-[0_0_10px_rgba(239,35,60,0.8)]">
            </div>
            <h3 class="text-3xl font-bold mb-3 font-title text-white tracking-wide" id="alert-title">Увага</h3>
            <p class="text-theme-muted mb-8 text-sm leading-relaxed" id="alert-message">Щось пішло не так.</p>
            <button onclick="closeAlert()" class="btn-gold py-2.5 px-8 rounded-xl w-full uppercase tracking-widest font-title text-lg">Зрозуміло</button>
        </div>
    </div>

    <!-- Inventory Modal -->
    <div id="inventory-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex flex-col items-center justify-center p-4">
        <div class="glass-card jojo-border-gold rounded-3xl p-6 max-w-2xl w-full shadow-glow-gold flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                <div class="flex items-center gap-3">
                    <img src="assets/icons/inventory.svg" alt="🎒" class="w-8 h-8 icon-svg">
                    <h3 class="text-3xl font-bold font-title text-theme-gold uppercase tracking-wider">Інвентар</h3>
                </div>
                <button onclick="closeInventoryModal()" class="text-theme-muted hover:text-theme-danger transition-colors bg-white/5 p-2 rounded-xl">
                    <img src="assets/icons/close.svg" alt="❌" class="w-6 h-6 icon-svg">
                </button>
            </div>
            <div id="inventory-modal-content" class="overflow-y-auto pr-3 space-y-5 flex-1">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <main id="screen-menu" class="screen active flex-col items-center justify-center relative p-6">
        <div class="z-10 text-center max-w-2xl w-full flex flex-col items-center">
            
            <div class="inline-flex items-center gap-2 bg-theme-primary/20 border border-theme-primary/50 text-theme-gold px-5 py-2 rounded-full text-xs font-bold tracking-widest uppercase mb-8 backdrop-blur-sm shadow-glow-primary">
                <img src="assets/icons/star.svg" alt="⭐" class="w-4 h-4">
                JoJo's Bizarre Adventure
                <img src="assets/icons/star.svg" alt="⭐" class="w-4 h-4">
            </div>
            
            <h1 class="text-7xl sm:text-8xl md:text-9xl font-title text-transparent bg-clip-text bg-gradient-to-br from-theme-gold to-theme-goldDark tracking-wider mb-2 drop-shadow-[0_10px_20px_rgba(255,183,3,0.3)]">
                JOJO AUCTION
            </h1>
            
            <p class="text-lg md:text-2xl text-theme-muted mb-12 font-title uppercase tracking-[0.3em] font-light">
                Аукціон Стендів Мультивсесвіту
            </p>
            
            <button onclick="switchScreen('screen-setup'); renderPlayerInputs();" class="btn-gold font-title text-2xl py-4 px-14 rounded-2xl uppercase tracking-[0.2em] w-full sm:w-auto flex items-center justify-center gap-3 group">
                <img src="assets/icons/play.svg" alt="▶" class="w-6 h-6 group-hover:scale-110 transition-transform">
                Грати
            </button>
        </div>
    </main>

    <main id="screen-setup" class="screen flex-col items-center justify-center p-4 sm:p-6 md:p-8">
        <div class="w-full max-w-2xl glass-card p-6 sm:p-10 rounded-3xl jojo-border relative my-auto">
            
            <button onclick="switchScreen('screen-menu')" class="absolute top-6 left-6 text-theme-muted hover:text-theme-gold flex items-center gap-2 transition-colors text-sm font-semibold bg-black/20 px-3 py-1.5 rounded-lg border border-white/5">
                <img src="assets/icons/close.svg" alt="←" class="w-4 h-4">
                Назад
            </button>
            
            <div class="text-center mb-8 mt-6">
                <h2 class="text-4xl sm:text-5xl font-title text-theme-gold uppercase tracking-wide drop-shadow-md">
                    Налаштування
                </h2>
                <p class="text-theme-primary text-sm font-title uppercase tracking-widest mt-2">Параметри гри</p>
            </div>
            
            <div class="space-y-8">
                <!-- Settings Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 bg-black/30 p-5 rounded-2xl border border-white/10">
                    <div>
                        <label class="flex items-center gap-2 text-xs font-bold text-theme-muted uppercase tracking-wider mb-3">
                            <img src="assets/icons/users.svg" alt="👥" class="w-4 h-4">
                            Кількість гравців
                        </label>
                        <select id="player-count" onchange="renderPlayerInputs()" class="custom-input w-full text-white rounded-xl p-3.5 focus:outline-none">
                            <option value="2">2 Гравці</option>
                            <option value="3" selected>3 Гравці</option>
                            <option value="4">4 Гравці</option>
                            <option value="5">5 Гравців</option>
                        </select>
                    </div>
                    <div>
                        <label class="flex items-center gap-2 text-xs font-bold text-theme-muted uppercase tracking-wider mb-3">
                            <img src="assets/icons/coin.svg" alt="💰" class="w-4 h-4">
                            Початковий баланс ($)
                        </label>
                        <input type="number" id="default-money" value="25" min="5" step="1" class="custom-input w-full text-theme-success font-bold rounded-xl p-3.5 focus:outline-none text-lg">
                    </div>
                </div>

                <!-- Players List -->
                <div>
                    <label class="flex items-center gap-2 text-xs font-bold text-theme-muted uppercase tracking-wider mb-3 ml-1">
                        Учасники Аукціону
                    </label>
                    <div id="players-container" class="space-y-3 max-h-[35vh] overflow-y-auto pr-2">
                        <!-- Dynamic inputs injected via JS -->
                    </div>
                </div>

                <div class="pt-2 text-center">
                    <button onclick="startGame()" class="btn-gold font-title text-2xl py-4 px-12 rounded-2xl uppercase tracking-[0.1em] w-full shadow-glow-gold">
                        Почати Аукціон
                    </button>
                </div>
            </div>
        </div>
    </main>

    <main id="screen-game" class="screen flex-col items-center justify-between p-4 pb-28 md:pb-24 relative">
        
        <!-- Header -->
        <header class="w-full max-w-6xl flex justify-between items-center py-4 px-2 z-20">
            <div class="flex items-center gap-4">
                <div class="bg-theme-card border border-theme-primary/50 text-theme-gold font-title px-6 py-2 rounded-2xl text-lg shadow-lg flex items-center gap-2 backdrop-blur-sm">
                    <img src="assets/icons/star.svg" alt="🃏" class="w-5 h-5">
                    <span id="current-card-counter">Карта 1/12</span>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="showInventoryModal()" class="glass-card hover:bg-theme-primary/20 text-white border border-white/10 px-5 py-2.5 rounded-xl font-title flex items-center gap-2 transition-all shadow-md">
                    <img src="assets/icons/inventory.svg" alt="🎒" class="w-5 h-5">
                    <span class="hidden sm:inline tracking-wider">Інвентар</span>
                </button>
                <button onclick="endGame()" class="glass-card hover:bg-theme-danger/20 text-theme-danger border border-theme-danger/30 px-5 py-2.5 rounded-xl font-title flex items-center gap-2 transition-all shadow-md">
                    <img src="assets/icons/stop.svg" alt="🛑" class="w-5 h-5">
                    <span class="hidden sm:inline tracking-wider">Завершити</span>
                </button>
            </div>
        </header>

        <!-- Main Card & Controls Grid -->
        <div class="w-full max-w-6xl my-auto grid grid-cols-1 lg:grid-cols-12 gap-8 items-stretch justify-center z-10">
            
            <!-- Left: Card Display -->
            <div class="lg:col-span-7 bg-theme-card rounded-3xl overflow-hidden jojo-border flex flex-col relative group max-w-xl mx-auto w-full shadow-2xl">
                
                <!-- Badges -->
                <div id="stand-peak-badge" class="absolute top-4 right-4 bg-gradient-to-r from-theme-danger to-theme-gold text-black font-title px-4 py-1.5 rounded-full border-2 border-white shadow-glow-danger z-20 flex items-center gap-1.5 font-bold text-sm tracking-wider uppercase transform rotate-2">
                    <img src="assets/icons/fire.svg" alt="🔥" class="w-4 h-4">
                    ПІК (PEAK)
                </div>
                
                <!-- Image Wrapper -->
                <div class="relative h-72 sm:h-96 w-full overflow-hidden bg-black flex items-center justify-center border-b-2 border-theme-primary/30">
                    <img id="stand-img" src="" alt="Stand" class="w-full h-full object-cover group-hover:scale-[1.03] transition-transform duration-700 ease-out">
                    <div class="absolute inset-0 bg-gradient-to-t from-theme-card via-transparent to-transparent opacity-80"></div>
                </div>
                
                <!-- Info Footer -->
                <div class="p-6 relative z-10 flex flex-col flex-1 bg-gradient-to-b from-theme-card to-[#0d0922]">
                    <div class="flex justify-between items-start mb-2">
                        <h3 id="stand-name" class="text-3xl sm:text-4xl font-title text-theme-gold leading-tight uppercase drop-shadow-md">
                            Stand Name
                        </h3>
                    </div>
                    <div class="inline-flex items-center gap-2 bg-black/40 border border-theme-success/30 px-3 py-1 rounded-lg w-fit mb-4">
                        <img src="assets/icons/coin.svg" alt="💵" class="w-4 h-4">
                        <span class="text-xs text-theme-muted uppercase tracking-wider font-bold">Старт:</span>
                        <span id="stand-base-cost" class="text-theme-success font-bold text-lg font-title">$1</span>
                    </div>
                    <p id="stand-desc" class="text-sm sm:text-base text-gray-300 leading-relaxed italic line-clamp-4 min-h-[4.5rem]">
                        Опис здібностей стенду...
                    </p>
                </div>
            </div>

            <!-- Right: Auction Controls -->
            <div class="lg:col-span-5 glass-card border border-theme-primary/50 p-6 sm:p-8 rounded-3xl shadow-glow-primary flex flex-col justify-center max-w-xl mx-auto w-full relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-40 h-40 bg-theme-primary/20 rounded-full blur-3xl pointer-events-none"></div>
                
                <h3 class="text-3xl font-title text-white mb-8 uppercase border-b border-white/10 pb-4 text-center flex items-center justify-center gap-3 tracking-widest">
                    <img src="assets/icons/hammer.svg" alt="🔨" class="w-8 h-8">
                    Ставка
                </h3>
                
                <div class="space-y-6 relative z-10">
                    <div>
                        <label class="flex items-center gap-2 text-xs font-bold text-theme-muted uppercase mb-3 tracking-wider">
                            <img src="assets/icons/users.svg" alt="👤" class="w-4 h-4">
                            Переможець лоту
                        </label>
                        <select id="auction-winner" class="custom-input w-full text-white rounded-xl p-4 text-base font-semibold appearance-none">
                            <!-- Injected dynamically -->
                        </select>
                    </div>
                    
                    <div>
                        <label class="flex items-center gap-2 text-xs font-bold text-theme-muted uppercase mb-3 tracking-wider">
                            <img src="assets/icons/coin.svg" alt="💰" class="w-4 h-4">
                            Фінальна сума ($)
                        </label>
                        <input type="number" id="auction-cost" min="0" step="1" class="custom-input w-full text-theme-success rounded-xl p-4 text-3xl font-bold font-title placeholder:text-theme-success/30 text-center tracking-wider" placeholder="0">
                    </div>
                    
                    <div class="pt-4 space-y-3">
                        <button onclick="processBid()" class="btn-gold font-title text-2xl py-4 rounded-2xl uppercase tracking-[0.1em] w-full flex items-center justify-center gap-2">
                            <img src="assets/icons/hammer.svg" alt="✓" class="w-6 h-6">
                            ПРОДАТИ
                        </button>
                        <button onclick="skipCard()" class="w-full flex items-center justify-center gap-2 text-sm text-theme-muted hover:text-white py-3 transition-colors uppercase font-bold bg-white/5 rounded-xl border border-white/5 hover:bg-white/10">
                            <img src="assets/icons/skip.svg" alt="⏭" class="w-4 h-4">
                            Пропустити (Ніхто не купив)
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Live Player Balances Bar -->
        <div id="live-balances" class="fixed bottom-0 left-0 w-full bg-theme-surface/95 backdrop-blur-md border-t-2 border-theme-primary/50 px-4 py-4 flex gap-4 overflow-x-auto justify-start lg:justify-center z-30 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
            <!-- Balances injected here -->
        </div>
    </main>

    <main id="screen-results" class="screen flex-col items-center justify-start p-4 sm:p-6 md:p-10 overflow-y-auto">
        <div class="w-full max-w-6xl glass-card p-6 sm:p-10 rounded-[2rem] jojo-border my-6 relative">
            
            <div id="banners-container" class="w-full mb-10 flex justify-center hidden">
                <div class="relative group">
                    <img id="winner-banner" src="assets/banners/rank_1.png" alt="Winner Banner" class="w-full max-w-3xl h-40 md:h-56 object-cover rounded-2xl border-4 border-theme-gold shadow-glow-gold transition-transform duration-300">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent rounded-2xl"></div>
                </div>
            </div>

            <div class="text-center mb-12">
                <h2 class="text-5xl sm:text-6xl font-title text-theme-gold uppercase tracking-[0.1em] drop-shadow-lg flex justify-center items-center gap-4">
                    <img src="assets/icons/trophy.svg" alt="🏆" class="w-12 h-12 md:w-16 md:h-16">
                    Таблиця Лідерів
                    <img src="assets/icons/trophy.svg" alt="🏆" class="w-12 h-12 md:w-16 md:h-16">
                </h2>
                <p class="text-theme-primary text-sm sm:text-base font-title uppercase tracking-[0.3em] mt-3">
                    Аукціон завершено • Фінальний Рейтинг
                </p>
            </div>
            
            <div id="results-container" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Result cards injected here -->
            </div>

            <div class="mt-14 text-center">
                <button onclick="resetToMenu()" class="btn-primary font-title text-xl py-4 px-12 rounded-2xl uppercase tracking-[0.1em]">
                    Повернутися до Меню
                </button>
            </div>
        </div>
    </main>

    <script>
        const STANDS_DATA = [
            { id: 1, name: "Зоряна Платина (Star Platinum)", peak: true, baseCost: 1, description: "Неймовірна швидкість, абсолютна точність та нищівна сила. У піковій формі здатний зупиняти час на кілька секунд.", image: "assets/cards/star_platinum.png" },
            { id: 2, name: "Світ (The World)", peak: true, baseCost: 1, description: "Стенд Діо з величезною фізичною силою, здатний повністю зупиняти плин часу у всьому світі.", image: "assets/cards/the_world.png" },
            { id: 3, name: "Божевільний Діамант (Crazy Diamond)", peak: false, baseCost: 1, description: "Має величезну силу та унікальну здатність «відновлювати» й лагодити будь-які зламані предмети та лікувати людей.", image: "assets/cards/crazy_diamond.png" },
            { id: 4, name: "Убивча Королева (Killer Queen)", peak: true, baseCost: 1, description: "Перетворює будь-який предмет, до якого торкається, на бомбу. Має здатність «Bites the Dust» для повернення часу назад.", image: "assets/cards/killer_queen.png" },
            { id: 5, name: "Золотий Досвід (Gold Experience)", peak: false, baseCost: 1, description: "Здатний наділяти неживі предмети життям, створювати живі організми та замінювати пошкоджені органи.", image: "assets/cards/gold_experience.png" },
            { id: 6, name: "Багряний Король (King Crimson)", peak: true, baseCost: 1, description: "Зтирає відрізки часу до 10 секунд та дозволяє передбачати майбутнє за допомогою епітафії.", image: "assets/cards/king_crimson.png" },
            { id: 7, name: "Кам'яне Море (Stone Free)", peak: false, baseCost: 1, description: "Дозволяє розпускати власне тіло на міцні нитки для розвідки, захисту та атаки на відстані.", image: "assets/cards/stone_free.png" },
            { id: 8, name: "Брудні Справи за Копійки (D4C)", peak: true, baseCost: 1, description: "Дозволяє власнику переміщатися між паралельними вимірами та залучати двійників для бою.", image: "assets/cards/d4c.png" },
            { id: 9, name: "М'який та Вологий (Soft & Wet)", peak: false, baseCost: 1, description: "Випускає мильні бульбашки, здатні «викрадати» властивості об'єктів (тертя, зір, звук тощо).", image: "assets/cards/soft_and_wet.png" },
            { id: 10, name: "Срібна Колісниця (Silver Chariot)", peak: false, baseCost: 1, description: "Віртуозний фехтувальник із блискавичною швидкістю. Може скидати броню задля надлюдської спритності.", image: "assets/cards/silver_chariot.png" },
            { id: 11, name: "Прогноз Погоди (Weather Report)", peak: true, baseCost: 1, description: "Повний контроль над атмосферою, погодою, тиском та можливістю викликати отруйний дощ або равликів.", image: "assets/cards/weather_report.png" },
            { id: 12, name: "Створений на Небесах (Made in Heaven)", peak: true, baseCost: 1, description: "Прискорює час Всесвіту до нескінченності, створюючи новий цикл існування та долю для всіх.", image: "assets/cards/made_in_heaven.png" },
            { id: 13, name: "Бивень Акт 4 (Tusk Act 4)", peak: true, baseCost: 1, description: "Використовує енергію Золотого Обертання. Здатен пробити будь-які бар'єри та просторові маніпуляції.", image: "assets/cards/tusk_act_4.png" },
            { id: 14, name: "Диво Тебе (Wonder of U)", peak: true, baseCost: 1, description: "Втілення концепції лиха. Будь-хто, хто переслідує власника, неминуче стикається з фатальними випадковостями.", image: "assets/cards/wonder_of_u.png" },
            { id: 15, name: "Рука (The Hand)", peak: false, baseCost: 1, description: "Стирає простір правою рукою, змушуючи всесвіт 'зшивати' залишену порожнечу. Вкрай небезпечний.", image: "assets/cards/the_hand.png" },
            { id: 16, name: "Брама Раю (Heaven's Door)", peak: true, baseCost: 1, description: "Перетворює людей на 'книги', дозволяючи читати їхні спогади та записувати туди абсолютні накази.", image: "assets/cards/heavens_door.png" },
            { id: 17, name: "Липкі Пальці (Sticky Fingers)", peak: false, baseCost: 1, description: "Створює блискавки на будь-якій поверхні, дозволяючи розрізати об'єкти, ховатися або розчленовувати.", image: "assets/cards/sticky_fingers.png" },
            { id: 18, name: "Відлуння Акт 3 (Echoes Act 3)", peak: false, baseCost: 1, description: "Збільшує вагу цілі пропорційно до відстані до неї, використовуючи здібність '3 Freeze'.", image: "assets/cards/echoes_act_3.png" },
            { id: 19, name: "Пурпуровий Серпанок (Purple Haze)", peak: false, baseCost: 1, description: "Випускає смертоносний вірус, який пожирає живу плоть за лічені секунди. Вірус гине на світлі.", image: "assets/cards/purple_haze.png" },
            { id: 20, name: "Колісниця Реквієм (Chariot Requiem)", peak: true, baseCost: 1, description: "Керує душами. Міняє місцями душі людей навколо та змушує їхні власні тіла і стенди атакувати їх.", image: "assets/cards/chariot_requiem.png" },
            { id: 21, name: "Білий Змій (Whitesnake)", peak: true, baseCost: 1, description: "Вилучає зі свідомості жертви ДИСКИ спогадів та стендів, залишаючи людину в комі.", image: "assets/cards/whitesnake.png" },
            { id: 22, name: "Кілера Квін: Зараза (Bites the Dust)", peak: true, baseCost: 1, description: "Створює часову петлю, підриваючи кожного, хто дізнається таємницю власника, повертаючи час на годину назад.", image: "assets/cards/bites_the_dust.png" }
        ];

        let players = [];
        let deck = [];
        let currentCardIndex = 0;

        const defaultEmojiImages = [
            'assets/emojis/1.png', 'assets/emojis/2.png', 'assets/emojis/3.png',
            'assets/emojis/4.png', 'assets/emojis/5.png'
        ];

        function showAlert(title, message) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            document.getElementById('alert-modal').classList.remove('hidden');
        }

        function closeAlert() {
            document.getElementById('alert-modal').classList.add('hidden');
        }

        function switchScreen(screenId) {
            const screens = document.querySelectorAll('.screen');
            screens.forEach(screen => screen.classList.remove('active'));
            
            const targetScreen = document.getElementById(screenId);
            if (targetScreen) targetScreen.classList.add('active');
        }

        function renderPlayerInputs() {
            const count = parseInt(document.getElementById('player-count').value, 10);
            const container = document.getElementById('players-container');
            container.innerHTML = '';

            for (let i = 0; i < count; i++) {
                const playerDiv = document.createElement('div');
                playerDiv.className = 'grid grid-cols-12 gap-4 items-center bg-black/40 p-3 rounded-xl border border-white/5 hover:border-theme-primary/50 transition-colors';
                
                const emojiSrc = defaultEmojiImages[i % defaultEmojiImages.length];
                
                playerDiv.innerHTML = `
                    <div class="col-span-3 sm:col-span-2 flex justify-center">
                        <img id="player-emoji-img-${i}" src="${emojiSrc}" onerror="this.src='https://placehold.co/100x100/0f172a/00f5ff?text=P${i+1}'" alt="P${i+1}" class="w-12 h-12 rounded-full border-2 border-theme-gold object-cover bg-theme-surface shadow-md">
                        <input type="hidden" id="player-emoji-${i}" value="${emojiSrc}">
                    </div>
                    <div class="col-span-9 sm:col-span-10">
                        <input type="text" id="player-name-${i}" value="Гравець ${i + 1}" placeholder="Ім'я гравця" class="custom-input w-full text-white rounded-lg p-2.5 font-semibold focus:outline-none">
                    </div>
                `;
                container.appendChild(playerDiv);
            }
        }

        function startGame() {
            const count = parseInt(document.getElementById('player-count').value, 10);
            const defaultMoneyInput = parseInt(document.getElementById('default-money').value, 10);

            if (isNaN(defaultMoneyInput) || defaultMoneyInput <= 0) {
                showAlert("Помилка", "Вкажіть коректний початковий баланс!");
                return;
            }

            players = [];
            for (let i = 0; i < count; i++) {
                const nameInput = document.getElementById(`player-name-${i}`).value.trim();
                const emojiInput = document.getElementById(`player-emoji-${i}`).value;
                players.push({
                    id: i,
                    name: nameInput || `Гравець ${i + 1}`,
                    emoji: emojiInput,
                    money: defaultMoneyInput,
                    inventory: []
                });
            }

            deck = [...STANDS_DATA].sort(() => Math.random() - 0.5);
            currentCardIndex = 0;

            switchScreen('screen-game');
            updateAuctionWinnerOptions();
            renderCurrentCard();
            updateLiveBalances();
        }

        function renderCurrentCard() {
            if (currentCardIndex >= deck.length) {
                endGame();
                return;
            }

            const currentStand = deck[currentCardIndex];
            document.getElementById('current-card-counter').innerText = `Карта ${currentCardIndex + 1}/${deck.length}`;
            document.getElementById('stand-name').innerText = currentStand.name;
            document.getElementById('stand-desc').innerText = currentStand.description;

            const peakBadge = document.getElementById('stand-peak-badge');
            currentStand.peak ? peakBadge.classList.remove('hidden') : peakBadge.classList.add('hidden');

            const imgEl = document.getElementById('stand-img');
            imgEl.src = currentStand.image;
            imgEl.onerror = function() {
                this.onerror = null;
                const encodedText = encodeURIComponent(currentStand.name.split(' ')[0]);
                this.src = `https://placehold.co/600x800/0f172a/00f5ff?text=${encodedText}`;
            };

            document.getElementById('auction-cost').value = 1;
        }

        function updateAuctionWinnerOptions() {
            const select = document.getElementById('auction-winner');
            select.innerHTML = '';
            
            players.forEach(player => {
                const option = document.createElement('option');
                option.value = player.id;
                const isFull = player.inventory.length >= 3;
                option.innerText = `${player.name} ($${player.money.toLocaleString()}) — ${player.inventory.length}/3 стендів${isFull ? ' (ПОВНИЙ)' : ''}`;
                // Optional styling for dropdown items
                option.style.background = '#0f0a29';
                option.style.color = isFull ? '#ef233c' : '#f8fafc';
                select.appendChild(option);
            });
        }

        function updateLiveBalances() {
            const container = document.getElementById('live-balances');
            container.innerHTML = '';

            players.forEach(player => {
                const div = document.createElement('div');
                div.className = 'bg-theme-card border border-theme-primary/40 rounded-2xl px-4 py-2 flex items-center gap-3 whitespace-nowrap shadow-md min-w-fit transition-transform hover:scale-105';
                div.innerHTML = `
                    <img src="${player.emoji}" onerror="this.src='https://placehold.co/100x100/0f172a/00f5ff?text=${player.name.charAt(0)}'" class="w-8 h-8 rounded-full object-cover border-2 border-theme-primary/80">
                    <div class="flex flex-col">
                        <span class="text-[11px] font-bold text-theme-muted uppercase tracking-wider">${player.name}</span>
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-bold text-theme-success font-title">$${player.money.toLocaleString()}</span>
                            <span class="text-[10px] bg-theme-primary/30 border border-theme-primary/50 text-white px-1.5 py-0.5 rounded font-mono">${player.inventory.length}/3</span>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
            updateAuctionWinnerOptions();
        }

        function processBid() {
            if (currentCardIndex >= deck.length) return;

            const winnerId = parseInt(document.getElementById('auction-winner').value, 10);
            const cost = parseInt(document.getElementById('auction-cost').value, 10);

            if (isNaN(winnerId) || isNaN(cost) || cost < 0) {
                showAlert("Помилка", "Введіть дійсну суму ставки!");
                return;
            }

            const player = players.find(p => p.id === winnerId);
            if (!player) return showAlert("Помилка", "Оберіть переможця аукціону!");
            if (player.inventory.length >= 3) return showAlert("Ліміт", `У гравця ${player.name} вже 3 стенди!`);
            if (player.money < cost) return showAlert("Бракує коштів", `Баланс: $${player.money}, ставка: $${cost}`);

            player.money -= cost;
            player.inventory.push({ ...deck[currentCardIndex], boughtCost: cost });

            currentCardIndex++;
            updateLiveBalances();
            renderCurrentCard();
        }

        function skipCard() {
            currentCardIndex++;
            renderCurrentCard();
        }

        function endGame() {
            switchScreen('screen-results');
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            players.forEach(player => {
                const totalSpent = player.inventory.reduce((sum, item) => sum + item.boughtCost, 0);
                const peakStands = player.inventory.filter(item => item.peak).length;
                const normalStands = player.inventory.length - peakStands;
                
                player.score = (peakStands * 50) + (normalStands * 15) + (player.money / 1);
                player.totalSpent = totalSpent;
                player.peakStandsCount = peakStands;
            });

            players.sort((a, b) => b.score - a.score);

            if (players.length > 0) {
                const bannerContainer = document.getElementById('banners-container');
                const winnerBanner = document.getElementById('winner-banner');
                bannerContainer.classList.remove('hidden');
                winnerBanner.src = 'assets/banners/rank_1.png';
                winnerBanner.onerror = function() {
                    this.onerror = null;
                    this.src = `https://placehold.co/1200x400/0f172a/00f5ff?text=WINNER:+${encodeURIComponent(players[0].name)}`;
                };
            }

            players.forEach((player, index) => {
                const cardDiv = document.createElement('div');
                
                let borderClass = 'border-theme-primary/30';
                let rankBadge = '';
                if (index === 0) {
                    borderClass = 'border-theme-gold shadow-glow-gold bg-gradient-to-br from-theme-card to-black';
                    rankBadge = `<span class="absolute -top-4 -left-4 bg-theme-gold text-black font-title font-bold w-12 h-12 flex items-center justify-center rounded-full border-4 border-theme-bg shadow-xl text-2xl z-10">1</span>`;
                } else if (index === 1) {
                    borderClass = 'border-gray-400 shadow-[0_0_15px_rgba(156,163,175,0.3)] bg-gradient-to-br from-theme-card to-black';
                    rankBadge = `<span class="absolute -top-4 -left-4 bg-gray-400 text-black font-title font-bold w-12 h-12 flex items-center justify-center rounded-full border-4 border-theme-bg shadow-xl text-xl z-10">2</span>`;
                } else if (index === 2) {
                    borderClass = 'border-theme-primary shadow-[0_0_15px_rgba(14,165,233,0.3)] bg-gradient-to-br from-theme-card to-black';
                    rankBadge = `<span class="absolute -top-4 -left-4 bg-theme-primary text-white font-title font-bold w-12 h-12 flex items-center justify-center rounded-full border-4 border-theme-bg shadow-xl text-xl z-10">3</span>`;
                } else {
                    rankBadge = `<span class="absolute -top-4 -left-4 bg-theme-surface text-theme-muted font-title font-bold w-10 h-10 flex items-center justify-center rounded-full border-2 border-white/10 shadow-lg text-lg z-10">${index + 1}</span>`;
                }

                cardDiv.className = `relative glass-card border-2 ${borderClass} p-6 sm:p-8 rounded-3xl flex flex-col justify-between transition-transform hover:-translate-y-1`;

                let inventoryHTML = '';
                if (player.inventory.length === 0) {
                    inventoryHTML = `<div class="mt-4 bg-black/30 rounded-xl p-4 text-center border border-white/5"><p class="text-sm text-theme-muted italic">Жодного стенду</p></div>`;
                } else {
                    inventoryHTML = `
                        <div class="mt-5 space-y-3">
                            <p class="text-xs font-bold text-theme-muted uppercase tracking-widest flex items-center gap-2">
                                <img src="assets/icons/inventory.svg" alt="🎒" class="w-4 h-4">
                                Стенди (${player.inventory.length})
                            </p>
                            <div class="space-y-2">
                                ${player.inventory.map(item => `
                                    <div class="bg-black/40 p-3 rounded-xl border border-white/5 flex justify-between items-center text-sm hover:border-theme-primary/40 transition-colors">
                                        <div class="flex items-center gap-2">
                                            <img src="assets/icons/${item.peak ? 'fire.svg' : 'star.svg'}" alt="${item.peak ? '🔥' : '⭐'}" class="w-4 h-4">
                                            <span class="font-semibold text-gray-200">${item.name}</span>
                                        </div>
                                        <span class="text-theme-success font-bold font-title bg-theme-success/10 px-2 py-0.5 rounded-md border border-theme-success/20">
                                            $${item.boughtCost.toLocaleString()}
                                        </span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                cardDiv.innerHTML = `
                    ${rankBadge}
                    <div>
                        <div class="flex justify-between items-center border-b border-white/10 pb-4 mb-4 ml-6 sm:ml-8">
                            <div class="flex items-center gap-4">
                                <img src="${player.emoji}" onerror="this.src='https://placehold.co/100x100/0f172a/00f5ff?text=${player.name.charAt(0)}'" class="w-14 h-14 rounded-full object-cover border-2 border-theme-primary">
                                <h3 class="text-2xl sm:text-3xl font-title text-white tracking-wide">${player.name}</h3>
                            </div>
                            <div class="flex flex-col items-end gap-1.5">
                                ${player.peakStandsCount > 0 ? `<span class="bg-theme-danger/20 border border-theme-danger text-theme-danger text-xs px-3 py-1 rounded-full font-bold flex items-center gap-1"><img src="assets/icons/fire.svg" alt="🔥" class="w-3 h-3"> ${player.peakStandsCount} Пік</span>` : ''}
                                <span class="text-[11px] text-theme-gold uppercase tracking-[0.2em] font-bold">Бали: ${Math.floor(player.score)}</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <div class="bg-black/40 p-3.5 rounded-xl border border-white/5 flex flex-col justify-center items-center">
                                <span class="text-[10px] text-theme-muted uppercase tracking-wider mb-1 flex items-center gap-1"><img src="assets/icons/coin.svg" alt="💰" class="w-3 h-3"> Залишок</span>
                                <span class="text-lg font-bold text-theme-success font-title">$${player.money.toLocaleString()}</span>
                            </div>
                            <div class="bg-black/40 p-3.5 rounded-xl border border-white/5 flex flex-col justify-center items-center">
                                <span class="text-[10px] text-theme-muted uppercase tracking-wider mb-1 flex items-center gap-1"><img src="assets/icons/hammer.svg" alt="🔨" class="w-3 h-3"> Витрачено</span>
                                <span class="text-lg font-bold text-white font-title">$${player.totalSpent.toLocaleString()}</span>
                            </div>
                        </div>
                        ${inventoryHTML}
                    </div>
                `;
                container.appendChild(cardDiv);
            });
        }

        function resetToMenu() { switchScreen('screen-menu'); }

        function showInventoryModal() {
            const container = document.getElementById('inventory-modal-content');
            container.innerHTML = '';
            players.forEach(player => {
                const playerDiv = document.createElement('div');
                playerDiv.className = 'bg-black/40 p-5 rounded-2xl border border-white/10';
                
                let inventoryHTML = '';
                if (player.inventory.length === 0) {
                    inventoryHTML = '<p class="text-sm text-theme-muted italic mt-3">Немає куплених стендів</p>';
                } else {
                    inventoryHTML = `
                        <div class="mt-4 space-y-2">
                            ${player.inventory.map(item => `
                                <div class="bg-white/5 p-3 rounded-xl border border-white/5 flex justify-between items-center text-sm">
                                    <div class="flex items-center gap-2">
                                        <img src="assets/icons/${item.peak ? 'fire.svg' : 'star.svg'}" alt="${item.peak ? '🔥' : '⭐'}" class="w-4 h-4">
                                        <span class="font-medium text-white">${item.name}</span>
                                    </div>
                                    <span class="text-theme-success font-bold bg-theme-success/10 px-2 py-0.5 rounded border border-theme-success/20">$${item.boughtCost}</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                playerDiv.innerHTML = `
                    <div class="flex justify-between items-center border-b border-white/10 pb-3">
                        <div class="flex items-center gap-3">
                            <img src="${player.emoji}" onerror="this.src='https://placehold.co/100x100/0f172a/00f5ff?text=${player.name.charAt(0)}'" class="w-10 h-10 rounded-full border border-theme-primary object-cover bg-black">
                            <h4 class="font-title text-white text-xl tracking-wide">${player.name}</h4>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] text-theme-muted block uppercase tracking-wider mb-0.5">Баланс</span>
                            <span class="text-theme-success font-bold font-title text-lg">$${player.money}</span>
                        </div>
                    </div>
                    ${inventoryHTML}
                `;
                container.appendChild(playerDiv);
            });
            document.getElementById('inventory-modal').classList.remove('hidden');
        }

        function closeInventoryModal() { document.getElementById('inventory-modal').classList.add('hidden'); }

        window.onload = function() { renderPlayerInputs(); };
    </script>
</body>
</html>
